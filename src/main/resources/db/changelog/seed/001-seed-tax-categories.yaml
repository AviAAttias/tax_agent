              - column: {name: name, value: "Revenue > Rental Income"}
              - column: {name: schedule_line, value: "3"}
              - column: {name: tax_form, value: SCHEDULE_E}
              - column: {name: requires_human_review, valueBoolean: true}
              - column: {name: is_active, valueBoolean: true}

        - insert:

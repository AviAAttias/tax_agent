databaseChangeLog:
  # Full two-level tax category hierarchy (§Implementation Spec §2).
  # Covers Schedule C, Schedule E, and common business expense types.
  # This data is immutable platform reference data — not tenant-specific.

  - changeSet:
      id: seed-001-tax-categories-level1
      author: platform-engineering
      context: "!test"
      changes:
        # ===== TOP-LEVEL CATEGORIES =====
        - insert:
            tableName: tax_categories
            columns:
              - column: {name: code, value: REVENUE}
              - column: {name: parent_code, value: null}
              - column: {name: name, value: "Revenue"}
              - column: {name: description, value: "All income received by the business"}
              - column: {name: tax_form, value: SCHEDULE_C}
              - column: {name: requires_human_review, valueBoolean: false}
              - column: {name: is_active, valueBoolean: true}

        - insert:
            tableName: tax_categories
            columns:
              - column: {name: code, value: EXPENSE}
              - column: {name: parent_code, value: null}
              - column: {name: name, value: "Business Expenses"}
              - column: {name: description, value: "All business expenses"}
              - column: {name: tax_form, value: SCHEDULE_C}
              - column: {name: requires_human_review, valueBoolean: false}
              - column: {name: is_active, valueBoolean: true}

        - insert:
            tableName: tax_categories
            columns:
              - column: {name: code, value: TRANSFER}
              - column: {name: parent_code, value: null}
              - column: {name: name, value: "Transfers (Non-taxable)"}
              - column: {name: description, value: "Interaccount transfers — not income or expense"}
              - column: {name: requires_human_review, valueBoolean: false}
              - column: {name: is_active, valueBoolean: true}

        - insert:
            tableName: tax_categories
            columns:
              - column: {name: code, value: OWNER_DRAW}
              - column: {name: parent_code, value: null}
              - column: {name: name, value: "Owner Draws / Distributions"}
              - column: {name: description, value: "Draws from business to owner — not deductible"}
              - column: {name: deductibility_tier, value: NON_DEDUCTIBLE}
              - column: {name: deductibility_percentage, valueNumeric: 0}
              - column: {name: requires_human_review, valueBoolean: true}
              - column: {name: is_active, valueBoolean: true}

      # ===== REVENUE SUBCATEGORIES (Schedule C, Line 1) =====
        - insert:
            tableName: tax_categories
            columns:
              - column: {name: code, value: REVENUE_SALES}
              - column: {name: parent_code, value: REVENUE}
              - column: {name: name, value: "Revenue > Sales"}
              - column: {name: deductibility_tier, value: FULLY_DEDUCTIBLE}
              - column: {name: deductibility_percentage, valueNumeric: 100}
              - column: {name: schedule_line, value: "1a"}
              - column: {name: tax_form, value: SCHEDULE_C}
              - column: {name: requires_human_review, valueBoolean: false}
              - column: {name: is_active, valueBoolean: true}

        - insert:
            tableName: tax_categories
            columns:

databaseChangeLog:
  # RLS policies — the authoritative isolation boundary (§8 Layer 2).
  # Applied as Liquibase changesets — never ad-hoc scripts.
  # ROLLBACK: Disabling RLS would be a security regression; rollback is intentionally not provided.
  # Any removal of RLS requires a security review and explicit approval.

  - changeSet:
      id: 014-enable-rls-bank-accounts
      author: platform-engineering
      runOnChange: false
      changes:
        - sql:
            sql: |
              ALTER TABLE bank_accounts ENABLE ROW LEVEL SECURITY;
              ALTER TABLE bank_accounts FORCE ROW LEVEL SECURITY;
              CREATE POLICY tenant_isolation ON bank_accounts
                USING (tenant_id = current_setting('app.tenant_id', true)::uuid);
      rollback:
        - sql:
            sql: |
              DROP POLICY IF EXISTS tenant_isolation ON bank_accounts;
              ALTER TABLE bank_accounts DISABLE ROW LEVEL SECURITY;


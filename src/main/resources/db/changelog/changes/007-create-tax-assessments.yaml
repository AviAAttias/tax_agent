databaseChangeLog:
  - changeSet:
      id: 007-create-tax-assessments
      author: platform-engineering
      changes:
        - createTable:
            tableName: tax_assessments
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: statement_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: period_start
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: period_end
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: INTEGER
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: total_income
                  type: DECIMAL(19,4)
              - column:
                  name: total_expenses
                  type: DECIMAL(19,4)
              - column:
                  name: total_deductible_expenses
                  type: DECIMAL(19,4)
              - column:
                  name: net_profit_loss
                  type: DECIMAL(19,4)
              - column:
                  name: estimated_federal_tax
                  type: DECIMAL(19,4)
              - column:
                  name: estimated_state_tax
                  type: DECIMAL(19,4)
              - column:
                  name: overall_confidence
                  type: DECIMAL(5,4)
              - column:
                  name: finalized_at
                  type: TIMESTAMPTZ
              - column:
                  name: payload_hash
                  type: VARCHAR(64)
              - column:
                  name: prior_version_id
                  type: UUID
              - column:
                  name: review_notes
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - createIndex:
            tableName: tax_assessments
            indexName: idx_tax_assessments_tenant_id
            columns:
              - column:
                  name: tenant_id
        - createIndex:
            tableName: tax_assessments
            indexName: idx_tax_assessments_tenant_period
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: period_start
              - column:
                  name: period_end
        - createIndex:
            tableName: tax_assessments
            indexName: idx_tax_assessments_tenant_status
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: status

databaseChangeLog:
  - changeSet:
      id: 013-create-processed-events
      author: platform-engineering
      changes:
        - createTable:
            tableName: processed_events
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: consumer_group
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: processed_events
            indexName: idx_processed_events_event_consumer
            columns:
              - column:
                  name: event_id
              - column:
                  name: consumer_group
            unique: true
        - createIndex:
            tableName: processed_events
            indexName: idx_processed_events_processed_at
            columns:
              - column:
                  name: processed_at

databaseChangeLog:
  - changeSet:
      id: 003-create-bank-accounts
      author: platform-engineering
      changes:
        - createTable:
            tableName: bank_accounts
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: institution
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: account_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: alias
                  type: VARCHAR(255)
              - column:
                  name: plaid_access_token_encrypted
                  type: VARCHAR(512)
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: last_fetched_at
                  type: TIMESTAMPTZ
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - createIndex:
            tableName: bank_accounts
            indexName: idx_bank_accounts_tenant_id
            columns:
              - column:
                  name: tenant_id
        - createIndex:
            tableName: bank_accounts
            indexName: idx_bank_accounts_tenant_active
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: is_active

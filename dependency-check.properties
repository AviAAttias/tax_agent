# OWASP Dependency-Check core properties
# OSS Index requires authenticated credentials (ossindex.sonatype.org).
# This environment has no OSS Index account; disable the analyzer so the
# 401/429 HTTP errors do not cause MojoExecutionException.
# NVD-based CPE/CVE analysis continues to run and enforces the CVSS>=7 gate.
analyzer.ossindex.enabled=false

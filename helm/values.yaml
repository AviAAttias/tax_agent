# Default values — overridden by values-staging.yaml and values-production.yaml (§18.2)

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 5
  failureThreshold: 30  # higher threshold for startup — allows up to 150s startup time

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"  # allow statement file uploads
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix

# PgBouncer sidecar (§15.4)
pgbouncer:
  enabled: true
  image: pgbouncer/pgbouncer:latest
  poolMode: session  # session mode for RLS compatibility (§15.3)
  maxClientConn: 100
  defaultPoolSize: 10
  databaseHost: ""  # injected per environment
  databaseName: ""
  databasePort: 5432

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Vault CSI secrets (§13)
vault:
  address: "https://vault.internal:8200"
  roleName: "tax-assessment-service"
  secretsPath: "kv/data/tax-assessment-service"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

env:
  APP_ENVIRONMENT: local

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - tax-assessment-service
          topologyKey: kubernetes.io/hostname

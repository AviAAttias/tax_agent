# HashiCorp Vault CSI driver SecretProviderClass (§13.2)
# Mounts secrets as files into /vault/secrets/
# Spring Boot reads via spring.config.import=configtree:/vault/secrets/
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "tax-assessment-service.fullname" . }}-secrets
  labels:
    {{- include "tax-assessment-service.labels" . | nindent 4 }}
spec:
  provider: vault
  parameters:
    vaultAddress: {{ .Values.vault.address | quote }}
    roleName: {{ .Values.vault.roleName | quote }}
    objects: |
      - objectName: "db-password"
        secretPath: "{{ .Values.vault.secretsPath }}/db"
        secretKey: "password"
      - objectName: "db-username"
        secretPath: "{{ .Values.vault.secretsPath }}/db"
        secretKey: "username"
      - objectName: "openai-api-key"
        secretPath: "{{ .Values.vault.secretsPath }}/openai"
        secretKey: "api-key"
      - objectName: "jwt-issuer-uri"
        secretPath: "{{ .Values.vault.secretsPath }}/auth"
        secretKey: "issuer-uri"
      - objectName: "twilio-account-sid"
        secretPath: "{{ .Values.vault.secretsPath }}/twilio"
        secretKey: "account-sid"
      - objectName: "twilio-auth-token"
        secretPath: "{{ .Values.vault.secretsPath }}/twilio"
        secretKey: "auth-token"
      - objectName: "twilio-from-number"
        secretPath: "{{ .Values.vault.secretsPath }}/twilio"
        secretKey: "from-number"
      - objectName: "kafka-sasl-username"
        secretPath: "{{ .Values.vault.secretsPath }}/kafka"
        secretKey: "sasl-username"
      - objectName: "kafka-sasl-password"
        secretPath: "{{ .Values.vault.secretsPath }}/kafka"
        secretKey: "sasl-password"
      - objectName: "mail-username"
        secretPath: "{{ .Values.vault.secretsPath }}/mail"
        secretKey: "username"
      - objectName: "mail-password"
        secretPath: "{{ .Values.vault.secretsPath }}/mail"
        secretKey: "password"
